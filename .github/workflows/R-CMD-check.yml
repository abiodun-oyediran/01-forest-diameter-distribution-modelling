name: R pipeline check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fitdistrplus
            any::goftest

      - name: Run pipeline
        run: Rscript run_all.R

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: outputs/figures/

      - name: Upload tables
        uses: actions/upload-artifact@v4
        with:
          name: tables
          path: outputs/tables/
